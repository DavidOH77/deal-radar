name: Hourly production crawl

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-production-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Refresh DealRadar data
        env:
          CRAWL_URL: https://deal-radar-lac.vercel.app/api/cron/crawl
          CRON_SECRET: ${{ secrets.DEALRADAR_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 360 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$CRAWL_URL"
