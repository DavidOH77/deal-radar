name: Hourly production health check

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify production backend
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 30 "$HEALTH_URL"
